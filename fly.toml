# fly.toml app configuration file generated for the translator service

app = "your-translator-app-name"
primary_region = "ams" # Change to your preferred Fly region (e.g., "lax", "cdg", "mia")

[build]
  # Uses the Dockerfile present in your repository root
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MAX_CONTENT_LENGTH = "26214400" # 25MB allocation threshold

[[services]]
  http_service = true
  internal_port = 8080
  processes = ["app"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "10s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = "2s"
    tls_skip_verify = false

[processes]
  # Spawns exactly 1 worker but spreads the workload across safe execution threads
  app = "gunicorn app:app --bind 0.0.0.0:8080 --workers 1 --threads 4 --timeout 60"
